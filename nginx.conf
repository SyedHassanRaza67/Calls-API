# nginx.conf — serves the built SPA and reverse-proxies the API.
#
# Mounted into the frontend image at /etc/nginx/conf.d/default.conf.
#
# Two ways to wire the SPA to the API:
#   1. (default) Same-origin: the SPA is built with VITE_API_URL=/api and this server
#      proxies /api/ -> the `backend` service. Frontend and API share one origin/port
#      (WEB_PORT), which avoids CORS and only needs one port open on the VPS.
#   2. Direct: build with VITE_API_URL=http://YOUR_HOST:8080/api so the browser hits the
#      backend's published API_PORT directly. Then the /api proxy block below is unused
#      (harmless). The backend must allow CORS for the web origin in that mode.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for static assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Reverse-proxy the API to the backend service on the internal network.
    # "backend" resolves via Docker DNS on calls-api-net; it listens on 8080.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # Cache hashed static assets aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA history-API fallback: any unknown path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not cache the HTML shell, so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
